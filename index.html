<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Civitas news</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <ul class="nav-right">
      <li><a href="https://hanya98.github.io/seedtoscale/index2.html">Home</a></li>
      <li class="dropdown">
        <a href="https://hanya98.github.io/seedtoscale/services.html" class="dropbtn">Services</a>
        <div class="dropdown-content">
          <a href="https://hanya98.github.io/seedtoscale/citizen.html">Complaint Registration</a>
          <a href="https://hanya98.github.io/seedtoscale/tracking.html">Complaint Status</a>
          <a href="#">Public Infrastructure Updates</a>
          <a href="#">Happiness Index Feedback</a>
          <a href="#">Development Near Me</a>
          <a href="#">RTI</a>
        </div>
      </li>
      <li><a href="#">Newsroom</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="nav-center">
      <div class="logo">CIVITAS</div>
    </div>

    <div class="nav-left">
      <select class="language-switch">
        <option>English</option>
        <option>हिन्दी</option>
      </select>
      <a href="#" class="login-btn citizen">Login as Citizen</a>
      <a href="#" class="login-btn admin">Login as Admin</a>
    </div>
  </nav>

  <div class="tricolor-bar">
    <span class="stripe saffron"></span>
    <span class="stripe white"></span>
    <span class="stripe green"></span>
  </div>

  <header class="hero">
    <div class="slider">
      <div class="slide active"><img src="room.jpeg" alt="Slide 1" /></div>
      <div class="slide"><img src="room.jpeg" alt="Slide 2" /></div>
      <div class="slide"><img src="room.jpeg" alt="Slide 3" /></div>
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>
  </header>

  <section class="newsroom-container" aria-label="Newsroom">
    <h1 class="news-month">IN Newsroom</h1>

    <div class="top-bar">
      <button id="expandBtn" class="collapse-btn" type="button">Expand All</button>
      <div class="search-wrapper">
        <input type="text" id="newsSearch" placeholder="Search news updates...">
        <button class="search-btn">🔍</button>
      </div>
    </div>

    <div id="newsContainer"></div>
  </section>

  <footer class="footer">
    <p>© 2026 CivicConnect | Made by Team SeedtoScale</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
